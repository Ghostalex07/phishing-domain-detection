name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # Actions are pinned to a commit SHA, not a tag: a tag is mutable, so anyone
      # who can move v4 can change the code that runs on this repository's
      # runners with this job's token. Dependabot bumps these.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: python -m mypy
      - name: Run unit tests
        run: python -m pytest
      - name: Run the full pipeline
        run: phishing-pipeline
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-domain-detection"
version = "0.1.0"
description = "Similarity-based phishing domain detection using Certificate Transparency logs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["phishing", "cybersecurity", "domains", "certificate-transparency", "typosquatting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
# Upper bounds are pinned to the next major release, not to the newest patch that
# happens to support Python 3.10. The project supports 3.10+, numpy drops 3.10 after
# 2.2.x and rapidfuzz after 3.14.5, so a tighter bound would block their current
# releases on newer interpreters for no security benefit.
dependencies = [
    "numpy>=1.24,<3",
    "rapidfuzz>=3.9,<4",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<3",
    # >=9.0.3 fixes GHSA-6w46-j5rx-g56g / PYSEC-2026-1845 (vulnerable tmpdir
    # handling). The test suite leans on tmp_path heavily, so this floor matters.
    "pytest>=9.0.3,<10",
    "ruff>=0.6,<1",
]

[project.scripts]
phishing-extract = "phishing_domain_detection.extract_domains:main"
phishing-preprocess = "phishing_domain_detection.preprocess:main"
phishing-similarity = "phishing_domain_detection.similarity:main"
phishing-cluster = "phishing_domain_detection.clustering:main"
phishing-base = "phishing_domain_detection.base_domain:main"
phishing-detect = "phishing_domain_detection.detect_new:main"
phishing-pipeline = "phishing_domain_detection.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phishing_domain_detection = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true